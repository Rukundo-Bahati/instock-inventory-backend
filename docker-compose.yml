# yaml-language-server: $schema=false

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env
    environment:
      # Override for Docker network - use service name as host
      - DB_HOST=db
    volumes:
      - ./src:/usr/src/app/src
      - ./package.json:/usr/src/app/package.json
      - ./tsconfig.json:/usr/src/app/tsconfig.json
    depends_on:
      - db
    networks:
      - instock-network

  db:
    image: postgres:15-alpine
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_DATABASE:-instock}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - instock-network

networks:
  instock-network:
    driver: bridge

volumes:
  postgres_data: