version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3020:3020"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=instock
      - JWT_SECRET=supersecretkey
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_USER=shammahhirwa19@gmail.com
      - EMAIL_PASS="zmsh owkx vipq otru"
    depends_on:
      - db
    networks:
      - instock-network

  db:
    image: postgres:15-alpine
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=instock
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - instock-network

networks:
  instock-network:
    driver: bridge

volumes:
  postgres_data:
